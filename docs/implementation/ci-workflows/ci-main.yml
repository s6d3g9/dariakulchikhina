# .github/workflows/ci-main.yml
# Основной CI pipeline для v6 — запускается на каждый PR.
# Target: < 10 минут total.

name: CI

on:
  pull_request:
    branches: [main, refactor/architecture-v5]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:

  # === 1. Validate (~2 мин) ===
  validate:
    name: Validate (lint, typecheck, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # для git diff HEAD~1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      - name: Lint errors (architectural invariants)
        run: pnpm lint:errors

      - name: Typecheck affected
        run: pnpm turbo:typecheck --filter=[HEAD~1]

      - name: Docs v5 verify
        run: pnpm docs:v5:verify

      - name: Docs v6 verify (scripted)
        run: node scripts/verify-v6-docs.mjs

      - name: Check flag naming
        run: node scripts/ci/flag-lint.js

      - name: Event schema drift
        run: |
          pnpm run events:build
          git diff --exit-code packages/events/dist/ || {
            echo "::error::Events codegen drift — run 'pnpm events:build' and commit"
            exit 1
          }

      - name: OpenAPI drift (generated from Zod)
        run: |
          pnpm run openapi:generate
          git diff --exit-code --stat packages/contracts-*/openapi.yaml || {
            echo "::error::OpenAPI drift — regenerate contracts"
            exit 1
          }

  # === 2. Test unit + contract (~5 мин) ===
  test-unit:
    name: Unit + Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}

      - name: Unit tests
        run: pnpm turbo:test --filter=[HEAD~1]

      - name: Contract tests
        run: pnpm run test:contract

      - name: Fractal harness
        run: pnpm run test:fractal

      - name: Coverage report
        if: success()
        run: |
          echo "Coverage per-package available в /coverage artifacts"

  # === 3. Build images (~3 мин parallel) ===
  build-services:
    name: Build service images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    strategy:
      matrix:
        service:
          - identity
          - wallet
          - payments
          - pattern-engine
          - timeline-engine
          - authorship-registry
          - booking
          - messenger
          - notifications
          - policy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: daria/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
          platforms: linux/amd64

      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: daria/${{ matrix.service }}:${{ github.sha }}
          format: cyclonedx-json

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: daria/${{ matrix.service }}:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # === 4. Integration tests (~5 мин) ===
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-unit, build-services]
    if: contains(github.event.pull_request.labels.*.name, 'integration-test')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: daria
          POSTGRES_PASSWORD: daria
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U daria"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      nats:
        image: nats:2.10-alpine
        ports: ['4222:4222', '8222:8222']
        options: --name nats
        volumes:
          - /tmp/nats:/data

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: pnpm install --frozen-lockfile

      - name: Run NATS with JetStream
        run: |
          docker exec nats nats-server -c /etc/nats.conf -js

      - name: Run integration tests
        env:
          DATABASE_URL: postgres://daria:daria@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          NATS_URL: nats://localhost:4222
        run: pnpm run test:integration

  # === 5. Summary ===
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [validate, test-unit, build-services]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Validate: ${{ needs.validate.result }}"
          echo "Unit Tests: ${{ needs.test-unit.result }}"
          echo "Build: ${{ needs.build-services.result }}"
          if [[ "${{ needs.validate.result }}" != "success" ]] || \
             [[ "${{ needs.test-unit.result }}" != "success" ]] || \
             [[ "${{ needs.build-services.result }}" != "success" ]]; then
            echo "::error::One or more CI stages failed"
            exit 1
          fi
